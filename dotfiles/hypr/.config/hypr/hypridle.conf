# hypridle.conf — LuicipherOS v0.1
#
# v0.1 scope: lock the session after 10 minutes idle. That is all.
#
# Deliberately NOT configured (removed 2026-11-11, see .agent/CONTINUITY.md):
#   - DPMS off after 12 min. Re-enabling it restores a recurring failure on this
#     machine: the GPU refuses to leave D3hot when the display is asked to wake,
#     leaving a black screen that only a power cut resolves. Do not add it back
#     without evidence that the D3hot->D0 transition works.
#   - systemctl suspend after 30 min. Suspend exercises the same failing
#     transition and is a direct route into the same dead-screen state.
#
# Screen blanking is handled by the monitor's own power-saving timer instead,
# which does not involve the GPU at all.
#
# To restore the old behaviour, append:
#   listener { timeout = 720
#              on-timeout = hyprctl dispatch dpms off
#              on-resume = hyprctl dispatch dpms on }
#   listener { timeout = 1800
#              on-timeout = systemctl suspend }

general {
  lock_cmd = pidof hyprlock || hyprlock
}

listener {
  timeout = 600
  on-timeout = loginctl lock-session
}
