# hyprlock.conf — LuicipherOS v0.1 (pacman-owned hyprlock, ADR-0001).
background {
  monitor =
  path = screenshot
  blur_passes = 2
  blur_size = 6
}
input-field {
  monitor =
  size = 220, 48
  dots_center = true
  fade_on_empty = false
  placeholder_text = <i>password</i>
  position = 0, -60
  halign = center
  valign = center
}
label {
  monitor =
  text = $TIME
  font_size = 64
  position = 0, 80
  halign = center
  valign = center
}
