# LuicipherOS local AI defaults (ADR-0002). No secrets here.
# Read by systemd user managers; install/profile.d/90-llm-ai.sh mirrors it for
# login shells. Per-user cloud keys belong in ~/.config/lui/ai.env (0600), never
# in this file.
GOOSE_PROVIDER=openai
GOOSE_PROVIDER__HOST=http://127.0.0.1:12434
GOOSE_PROVIDER__API_KEY=local
GOOSE_MODEL=general
GOOSE_TELEMETRY_ENABLED=false
OTEL_SDK_DISABLED=true
PI_TELEMETRY=0